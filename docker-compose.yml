# Production-style stack: the API behind an nginx gateway.
#
#   cp .env.example .env     # fill PORTAL_EMAIL, PORTAL_PASSWORD, API_KEYS
#   docker compose up -d --build
#   curl http://localhost/health
#
# Only nginx is published (port 80). The API is reachable inside the
# compose network only, so every request passes the gateway's limits.

services:
  api:
    build: .
    image: urja-api:latest
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "1" # one proxy (nginx) in front: client IPs for rate limits come from X-Forwarded-For
    expose:
      - "3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_headers.inc:/etc/nginx/conf.d/proxy_headers.inc:ro
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
