# nginx gateway in front of urja-api.
# Jobs: one public entry point, per-IP request limits before the app,
# gzip, request ids, sane timeouts, and only the methods the API uses.

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
limit_req_status 429;

upstream urja_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;   # the API only serves GETs

    # Gateway errors in the same problem+json shape as the API's own errors.
    error_page 429 = @too_many;
    error_page 403 405 = @not_allowed;
    location @too_many {
        default_type application/problem+json;
        add_header Retry-After 1 always;
        return 429 '{"type":"https://urja-api.local/problems/rate-limited","title":"Too many requests","status":429,"code":"rate_limited","detail":"Gateway limit: 20 requests per second per IP"}';
    }
    location @not_allowed {
        default_type application/problem+json;
        return 405 '{"type":"https://urja-api.local/problems/method-not-allowed","title":"Method not allowed","status":405,"code":"method_not_allowed","detail":"This API is read-only: GET, HEAD and OPTIONS only"}';
    }

    gzip on;
    gzip_types application/json application/problem+json application/geo+json text/css application/javascript;
    gzip_min_length 1024;

    # Readiness for load balancers and uptime checks, without rate limiting.
    
    location = /health { proxy_pass http://urja_api; include /etc/nginx/conf.d/proxy_headers.inc; }
    location = /ready  { proxy_pass http://urja_api; include /etc/nginx/conf.d/proxy_headers.inc; }

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_req zone=per_ip burst=40 nodelay;

        proxy_pass http://urja_api;
        include /etc/nginx/conf.d/proxy_headers.inc;

        # Anomaly scans and a fallback catalog load can take a while on a slow portal.
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
